<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikigai F1 — Refined</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Satoshi', sans-serif; background: #F9FAFB; color: #111827; padding: 40px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  p.subtitle { font-size: 14px; color: #4B5563; margin-bottom: 32px; }
  .preview { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 48px; max-width: 620px; }
  .preview h2 { font-size: 16px; font-weight: 700; color: #0D9488; margin-bottom: 4px; }
  .preview p.desc { font-size: 13px; color: #9CA3AF; margin-bottom: 24px; line-height: 1.5; }

  .ikigai-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 520px;
    margin: 0 auto;
  }

  /* The circles sit in a centered inner area, leaving corners for labels */
  .circles-area {
    position: absolute;
    /* Inset the circles so corners have room for labels */
    left: 18%;
    top: 18%;
    width: 64%;
    height: 64%;
  }

  .circle {
    position: absolute;
    border-radius: 50%;
    width: 58%;
    height: 58%;
    transform: translate(-50%, -50%);
    opacity: 0.55;
  }

  .center-circle {
    position: absolute;
    border-radius: 50%;
    width: 20%;
    height: 20%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #4A6741 40%, #8B9E6A 100%);
    box-shadow: 0 0 20px rgba(74,103,65,0.3);
    z-index: 5;
  }

  .center-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    text-align: center;
  }

  .center-label span {
    display: block;
    font-size: 9.5px;
    font-weight: 800;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.15em;
    line-height: 1.3;
  }

  /* Labels in the four corners of the outer wrapper */
  .corner-label {
    position: absolute;
    font-size: 17px;
    font-weight: 700;
    color: #111827;
    line-height: 1.3;
    z-index: 10;
  }


  .callout-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 8;
  }
</style>
</head>
<body>

<h1>F1 Refined — Diagonal Corner Callouts, Maximized Space</h1>
<p class="subtitle">Circles are inset to the center ~64% of the container. Labels live in the four corners with color-matched diagonal lines connecting them.</p>

<div class="preview">
  <div class="ikigai-wrap">

    <!-- Callout lines from circles to corners -->
    <svg class="callout-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
      <!-- Top-left: "What you love" — dot on yellow circle edge -->
      <line x1="35" y1="23.5" x2="22" y2="14" stroke="#C4B320" stroke-width="0.5" opacity="0.6" />
      <circle cx="35" cy="23.5" r="1" fill="#C4B320" opacity="0.7" />

      <!-- Bottom-left: "What you're good at" — dot on green circle edge -->
      <line x1="21" y1="66.5" x2="13" y2="78" stroke="#7AAD3A" stroke-width="0.5" opacity="0.6" />
      <circle cx="21" cy="66.5" r="1" fill="#7AAD3A" opacity="0.7" />

      <!-- Top-right: "What the world needs" — dot on pink circle edge -->
      <line x1="75" y1="37" x2="85" y2="24" stroke="#D4796E" stroke-width="0.5" opacity="0.6" />
      <circle cx="75" cy="37" r="1" fill="#D4796E" opacity="0.7" />

      <!-- Bottom-right: "What you can be paid for" — dot on teal circle edge -->
      <line x1="66" y1="78" x2="79" y2="87" stroke="#4DBAB4" stroke-width="0.5" opacity="0.6" />
      <circle cx="66" cy="78" r="1" fill="#4DBAB4" opacity="0.7" />
    </svg>

    <!-- Circles (inset area) -->
    <div class="circles-area">
      <div class="circle" style="background:#F5E642; left:50%; top:25%;"></div>
      <div class="circle" style="background:#A8DB5A; left:25%; top:55%;"></div>
      <div class="circle" style="background:#F4A79D; left:75%; top:55%;"></div>
      <div class="circle" style="background:#6DD5D0; left:50%; top:80%;"></div>
      <div class="center-circle"></div>
      <div class="center-label"><span>YOUR</span><span>BUSINESS</span></div>
    </div>

    <!-- Corner labels -->
    <div class="corner-label" style="top: 6%; left: 6%;">
      <div>What you love</div>
    </div>

    <div class="corner-label" style="bottom: 14%; left: 6%;">
      <div>What you're<br>good at</div>
    </div>

    <div class="corner-label" style="top: 16%; right: 6%; text-align: right;">
      <div>What the world<br>needs</div>
    </div>

    <div class="corner-label" style="bottom: 6%; right: 6%; text-align: right;">
      <div>What you can<br>be paid for</div>
    </div>

  </div>
</div>

</body>
</html>
