<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview: Login Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fff; color: #111827; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .login { width: 100%; max-width: 384px; padding: 0 16px; }
  h1 { font-size: 30px; font-weight: 700; text-align: center; }
  .sub { text-align: center; font-size: 14px; color: #4B5563; margin-top: 8px; }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; border: 2px solid #D1D5DB; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; background: #fff; cursor: pointer; margin-top: 32px; }
  .google-btn:hover { background: #F3F4F6; }
  .divider { display: flex; align-items: center; margin: 24px 0; }
  .divider-line { flex: 1; height: 1px; background: #E5E7EB; }
  .divider-text { padding: 0 8px; font-size: 12px; color: #9CA3AF; }
  label { display: block; font-size: 14px; font-weight: 500; margin-top: 16px; }
  input { display: block; width: 100%; border: 2px solid #D1D5DB; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 4px; outline: none; }
  input:focus { border-color: #0D9488; box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
  .btn-signin { width: 100%; background: #0D9488; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn-signin:hover { background: #0F766E; }
  .footer { text-align: center; margin-top: 24px; font-size: 14px; color: #9CA3AF; }
  .footer a { color: #0D9488; font-weight: 500; text-decoration: none; }
  .contact { text-align: center; margin-top: 8px; font-size: 12px; color: #9CA3AF; }
</style>
</head>
<body>

<div class="login">
  <h1>Sign in to Adaptable</h1>
  <p class="sub">Build your business. Learn by doing.</p>

  <button class="google-btn">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or sign in with email</span>
    <div class="divider-line"></div>
  </div>

  <label>Email</label>
  <input type="email" placeholder="you@school.edu" value="cristal@venturelabignite.org">

  <label>Password</label>
  <input type="password" placeholder="Your password" value="••••••••">

  <button class="btn-signin">Sign In</button>

  <p class="footer">Student? <a href="#">Join a class</a></p>
  <p class="contact">Contact your program administrator if you need access.</p>
</div>

</body>
</html>
