<!DOCTYPE html>

<head>

<title>VENTURE — Grouping Algorithm Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A0A0A; color: #9A9A9A; font-family: 'Space Mono', monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.terminal { width: 100%; max-width: 820px; border: 1px solid #2A2A2A; border-radius: 12px; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
.terminal-header { background: #1A1A1A; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2A2A2A; }
.dots { display: flex; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-r { background: #F87171; }
.dot-y { background: #FBBF24; }
.dot-g { background: #4ADE80; }
.terminal-title { font-size: 13px; color: #6A6A6A; letter-spacing: 0.05em; }
.terminal-controls { display: flex; gap: 8px; }
.btn { font-family: 'Space Mono', monospace; font-size: 12px; padding: 6px 16px; border-radius: 6px; cursor: pointer; border: 1px solid #3A3A3A; background: #1A1A1A; color: #C084FC; transition: all 0.15s; }
.btn:hover:not(:disabled) { background: #2A2A2A; border-color: #C084FC; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-run { border-color: #C084FC; }
.terminal-body { padding: 20px; height: 600px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
.terminal-body::-webkit-scrollbar { width: 6px; }
.terminal-body::-webkit-scrollbar-track { background: #0A0A0A; }
.terminal-body::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 3px; }
.line { white-space: pre-wrap; word-break: break-word; }
.line-step { color: #C084FC; }
.line-data { color: #F0EDE8; }
.line-pass { color: #4ADE80; }
.line-warn { color: #FBBF24; }
.line-final { color: #C084FC; font-weight: 700; }
.cursor { display: inline-block; width: 8px; height: 16px; background: #C084FC; animation: blink 0.8s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<div class="terminal">
  <div class="terminal-header">
    <div class="dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
    <div class="terminal-title">VENTURE — Grouping Algorithm</div>
    <div class="terminal-controls">
      <button class="btn btn-run" id="runBtn" onclick="runAlgorithm()">Run Algorithm</button>
      <button class="btn" id="replayBtn" onclick="replay()" disabled>Replay</button>
    </div>
  </div>
  <div class="terminal-body" id="output"></div>
</div>

let running = false;
const output = document.getElementById('output');

function replay() {
  output.innerHTML = '';
  document.getElementById('replayBtn').disabled = true;
  runAlgorithm();
}

async function runAlgorithm() {
  if (running) return;
  running = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('replayBtn').disabled = true;
  output.innerHTML = '';

  for (let i = 0; i < LINES.length; i++) {
    const line = LINES[i];
    const el = document.createElement('div');
    el.className = 'line ' + (line.cls || '');
    output.appendChild(el);

    // Remove any existing cursor
    const oldCursor = output.querySelector('.cursor');
    if (oldCursor) oldCursor.remove();

    if (line.text === '') {
      el.innerHTML = '&nbsp;';
      await sleep(line.delay || 200);
    } else {
      // Typewriter effect
      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      for (let c = 0; c < line.text.length; c++) {
        el.textContent = line.text.slice(0, c + 1);
        el.appendChild(cursor);
        output.scrollTop = output.scrollHeight;
        const charDelay = 20 + Math.random() * 30; // 20-50ms per char
        await sleep(charDelay);
      }
      cursor.remove();
      await sleep(line.delay || 200);
    }

    output.scrollTop = output.scrollHeight;
  }

  running = false;
  document.getElementById('replayBtn').disabled = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
