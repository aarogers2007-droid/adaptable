<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grouping Algorithm Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #F9FAFB; color: #111827; padding: 32px 24px; }
.container { max-width: 900px; margin: 0 auto; }

.terminal { border-radius: 12px; border: 1px solid #2A2A2A; background: #0A0A0A; overflow: hidden; }
.th { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #2A2A2A; background: #1A1A1A; }
.wd { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; padding: 0; transition: opacity 0.15s; }
.wd:hover { opacity: 0.7; }
.tt { font-family: 'Space Mono', monospace; font-size: 11px; color: #6A6A6A; }
.rb { font-family: 'Space Mono', monospace; font-size: 11px; padding: 4px 14px; border-radius: 5px; cursor: pointer; border: 1px solid #C084FC; background: #1A1A1A; color: #C084FC; transition: all 0.15s; }
.rb:hover { background: #2A2A2A; }
.rb:disabled { border-color: #2A2A2A; color: #4A4A4A; cursor: not-allowed; }

.tb { height: 520px; overflow-y: auto; }
#normalView { padding: 14px; font-family: 'Space Mono', monospace; font-size: 11px; line-height: 1.8; }
#rawView { padding: 12px 0; font-family: 'Space Mono', monospace; font-size: 11px; line-height: 1.7; display: none; }

.tf { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 8px 16px; border-top: 1px solid #2A2A2A; background: #1A1A1A; }
.sw { display: flex; align-items: center; gap: 8px; }
.sl { font-family: 'Space Mono', monospace; font-size: 10px; color: #4A4A4A; }
.ss { width: 64px; height: 4px; -webkit-appearance: none; appearance: none; border-radius: 2px; background: #2A2A2A; cursor: pointer; outline: none; }
.ss::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #C084FC; cursor: pointer; }
.ss::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #C084FC; border: none; cursor: pointer; }
.pill { display: flex; gap: 2px; border-radius: 6px; padding: 2px; background: #2A2A2A; }
.pb { border-radius: 4px; padding: 4px 12px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s; }
.pb.on { background: #3A3A3A; color: #E8E8E8; }
.pb:not(.on) { background: transparent; color: #6A6A6A; }

.cursor { display: inline-block; width: 6px; height: 13px; background: #C084FC; margin-left: 1px; vertical-align: text-bottom; animation: blink 0.8s step-end infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

.terminal:fullscreen { border-radius: 0; }
.terminal:fullscreen .tb { height: calc(100vh - 90px); }

/* Collapsed state */
.launch-wrap { display: none; justify-content: center; padding: 40px 0; }
.launch-btn { border-radius: 12px; padding: 16px 32px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; color: #fff; background: #C084FC; transition: transform 0.15s; animation: glow 2s ease-in-out infinite alternate; }
.launch-btn:hover { transform: scale(1.05); }
@keyframes glow {
  0% { box-shadow: 0 0 12px rgba(192,132,252,0.3), 0 0 30px rgba(192,132,252,0.1); }
  100% { box-shadow: 0 0 18px rgba(192,132,252,0.5), 0 0 45px rgba(192,132,252,0.2); }
}
</style>
</head>
<body>

<div class="container">
  <!-- Collapsed state -->
  <div class="launch-wrap" id="launchWrap">
    <button class="launch-btn" onclick="openTerminal()">View Grouping Algorithm</button>
  </div>

  <!-- Terminal -->
  <div class="terminal" id="terminal">
    <div class="th">
      <div style="display:flex;gap:6px">
        <button class="wd" style="background:#F87171" onclick="closeTerminal()" title="Close"></button>
        <button class="wd" style="background:#FBBF24" onclick="closeTerminal()" title="Minimize"></button>
        <button class="wd" style="background:#4ADE80" onclick="document.getElementById('terminal').requestFullscreen()" title="Fullscreen"></button>
      </div>
      <span class="tt" id="termTitle">VENTURE — Grouping Algorithm</span>
      <button class="rb" id="runBtn" onclick="runReplay()">Run Algorithm</button>
    </div>
    <div class="tb" id="termBody">
      <div id="normalView"><div style="color:#3A3A3A;padding:14px">Click "Run Algorithm" to see the grouping process.</div></div>
      <div id="rawView"></div>
    </div>
    <div class="tf">
      <div class="sw"><span class="sl">Speed</span><input type="range" class="ss" min="0" max="3" value="1" oninput="sp=[0.5,1,2,4][this.value]"></div>
      <div class="pill">
        <button class="pb on" id="pN" onclick="setMode('normal')">Normal</button>
        <button class="pb" id="pR" onclick="setMode('raw')">Raw</button>
      </div>
    </div>
  </div>
</div>

<script>
let mode = 'normal', sp = 1, isRunning = false, userScrolled = false;

function openTerminal() {
  document.getElementById('launchWrap').style.display = 'none';
  document.getElementById('terminal').style.display = 'block';
}
function closeTerminal() {
  if (document.fullscreenElement) document.exitFullscreen();
  document.getElementById('terminal').style.display = 'none';
  document.getElementById('launchWrap').style.display = 'flex';
}

function setMode(m) {
  mode = m;
  document.getElementById('pN').classList.toggle('on', m === 'normal');
  document.getElementById('pR').classList.toggle('on', m === 'raw');
  document.getElementById('termTitle').textContent = m === 'raw' ? 'invention-grouping.ts' : 'VENTURE — Grouping Algorithm';
  document.getElementById('normalView').style.display = m === 'normal' ? 'block' : 'none';
  document.getElementById('rawView').style.display = m === 'raw' ? 'block' : 'none';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms / sp)); }

const tb = document.getElementById('termBody');
tb.addEventListener('scroll', () => { userScrolled = tb.scrollHeight - tb.scrollTop - tb.clientHeight > 80; });
function autoScroll() { if (!userScrolled) tb.scrollTop = tb.scrollHeight; }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function colorize(l) {
  if (!l) return '&nbsp;';
  let s = esc(l);
  if (s.trimStart().startsWith('//')) return '<span style="color:#8B8B8B;font-style:italic">' + s + '</span>';
  s = s.replace(/(\[REDACTED\])/g, '<span style="color:#F87171;font-weight:600">$1</span>');
  s = s.replace(/("(?:[^"\\]|\\.)*")/g, '<span style="color:#C4B5FD">$1</span>');
  s = s.replace(/\b(import|export|from|const|let|var|function|async|await|return|if|else|for|while|of|in|new|continue)\b/g, '<span style="color:#D8B4FE">$1</span>');
  s = s.replace(/\b(Map|Set|Object|null|true|false)\b/g, '<span style="color:#93C5FD">$1</span>');
  s = s.replace(/\b(\d+)\b/g, '<span style="color:#FCD34D">$1</span>');
  s = s.replace(/\.(findIndex|flatMap|some|includes|every|splice|push|shift|get|set|from|select|eq|not|delete|insert|update|values|has|length)\b/g, '.<span style="color:#5EEAD4">$1</span>');
  s = s.replace(/\b(createClient)\b/g, '<span style="color:#5EEAD4">$1</span>');
  return s;
}

const RAW = `import [REDACTED];
import { createClient } from [REDACTED];

// Invention Mode Grouping Algorithm
// Five-step sort: category → archetype → chips → scale → voice

const VISUAL_CHIPS = ["Draw it", "Build a prototype", "Build a slide or poster"];
const VERBAL_CHIPS = ["Explain it out loud", "Write it out"];
const TARGET_ARCHETYPES = ["builder", "empath", "systems_thinker"];

export async function runGroupingAlgorithm(classCode, groupSize = 5) {
  const db = await createClient();
  const { data: sessions } = await db
    .from("invention_sessions")
    .select("student_id, circle_1_category, ...")
    .eq("class_code", classCode)
    .not("completed_at", "is", null);

  // ── Step 1: Primary sort on Circle 1 ──
  const pools = new Map();
  for (const s of students) {
    pools.get(s.circle_1_category) ?? [];
    pool.push(s);
    pools.set(s.circle_1_category, pool);
  }

  // ── Step 2: Archetype distribution ──
  for (const [category, pool] of pools) {
    const remaining = [...pool];
    while (remaining.length > 0) {
      if (remaining.length < 3) { /* merge */ }
      for (const archetype of TARGET_ARCHETYPES) {
        const idx = remaining.findIndex(s => s.archetype === archetype);
        if (idx !== -1) group.push(remaining.splice(idx, 1)[0]);
      }
      while (group.length < targetSize) { /* fill */ }
    }
  }

  // ── Step 3: Chip diversity ──
  const allChips = group.flatMap(s => s.chips);
  const diversity = new Set(allChips).size / allChips.length;

  // ── Step 4: Scale balance ──
  const dist = {};
  for (const s of group) dist[s.scale] = (dist[s.scale] ?? 0) + 1;
  const balanced = Object.values(dist).every(c => c <= 3);

  // ── Step 5: Voice coverage ──
  const visual = group.some(s => s.voice.some(v => VISUAL.includes(v)));
  const verbal = group.some(s => s.voice.some(v => VERBAL.includes(v)));

  // ── Database writes ──
  await db.from([REDACTED]).delete().eq("class_code", classCode);
  for (const group of allGroups) {
    await db.from([REDACTED]).insert({ ... });
  }
  return { log };
}`;

const LOG = [
  {t:'$ venture-group --class VENTURE --run',c:'#F0EDE8',d:400,b:1},{t:'',d:200},
  {t:'Initializing grouping algorithm for VENTURE...',c:'#9A9A9A',d:250},
  {t:'Loading 30 student profiles...',c:'#9A9A9A',d:350},
  {t:'Configuration: group_size=5, threshold=80%',c:'#9A9A9A',d:200},{t:'',d:200},
  {t:'── Step 1: Sorting by invention category (The Wish) ──',c:'#C084FC',d:500,b:1},
  {t:'  digital — 6    environmental — 6    medical — 6',c:'#F0EDE8',d:150},
  {t:'  learning — 5   social — 7',c:'#F0EDE8',d:150},
  {t:'  ✓ 5 category pools formed',c:'#4ADE80',d:300},{t:'',d:200},
  {t:'── Step 2: Distributing archetypes (The Mind) ──',c:'#C084FC',d:500,b:1},
  {t:'  Group 1 (digital): builder → empath → sys_thinker → connector → storyteller → builder',c:'#60A5FA',d:120},
  {t:'    ✓ Core archetypes present',c:'#4ADE80',d:150},
  {t:'  Group 2 (environmental): builder → empath → sys_thinker → connector ×2 → empath',c:'#60A5FA',d:120},
  {t:'    ✓ Core archetypes present',c:'#4ADE80',d:150},
  {t:'  Groups 3–5: ✓ All core archetypes present',c:'#4ADE80',d:200},{t:'',d:200},
  {t:'── Step 3: Evaluating chip diversity (The Lens) ──',c:'#C084FC',d:500,b:1},
  {t:'  G1: 33%  G2: 30%  G3: 27%  G4: 44%  G5: 45%',c:'#9A9A9A',d:200},{t:'',d:200},
  {t:'── Step 4: Checking scale balance (The Scale) ──',c:'#C084FC',d:500,b:1},
  {t:'  Group 1: ⚠ generation overrepresented (4×)',c:'#FBBF24',d:200},
  {t:'  Group 2: ⚠ world overrepresented (6×)',c:'#FBBF24',d:200},
  {t:'  Groups 3–4: ✓ balanced',c:'#4ADE80',d:130},
  {t:'  Group 5: ⚠ one_person overrepresented (4×)',c:'#FBBF24',d:200},{t:'',d:200},
  {t:'── Step 5: Checking voice coverage (The Voice) ──',c:'#C084FC',d:500,b:1},
  {t:'  All groups: visual ✓  verbal ✓',c:'#4ADE80',d:200},{t:'',d:200},
  {t:'── Writing results to database ──',c:'#C084FC',d:400,b:1},
  {t:'  Groups 1–5 → [REDACTED]',c:'#9A9A9A',d:200},
  {t:'  Updating group_number for 30 students...',c:'#9A9A9A',d:300},{t:'',d:300},
  {t:'═══════════════════════════════════════════',c:'#C084FC',d:200},
  {t:'Algorithm complete. 5 groups formed.',c:'#C084FC',d:400,b:1},
  {t:'2 groups met all criteria. 3 with compromises.',c:'#4ADE80',d:300},
  {t:'',d:800},
  {t:'"Have a great day" — AJ Rogers',c:'#A78BFA',d:0,i:1},
];

async function runReplay() {
  if (isRunning) return;
  isRunning = true; userScrolled = false;
  document.getElementById('runBtn').disabled = true;
  const nv = document.getElementById('normalView');
  const rv = document.getElementById('rawView');
  nv.innerHTML = ''; rv.innerHTML = '';
  setMode(mode);

  let rawIdx = 0, rawDone = false;
  const rawTotal = RAW.length;

  function renderRaw(n) {
    const text = RAW.slice(0, n), lines = text.split('\n');
    rv.innerHTML = '';
    lines.forEach((l, i) => {
      const div = document.createElement('div');
      div.style.cssText = 'padding:0 12px;display:flex;gap:10px';
      const last = i === lines.length - 1;
      const done = !last || n >= rawTotal;
      const html = done ? colorize(l) : ('<span style="color:#E8E8E8">' + esc(l) + '</span>' + (rawDone ? '' : '<span class="cursor"></span>'));
      div.innerHTML = '<span style="color:#3A3A3A;width:24px;text-align:right;flex-shrink:0;user-select:none;font-size:10px">' + (i+1) + '</span><span style="white-space:pre;color:#E8E8E8">' + html + '</span>';
      rv.appendChild(div);
    });
    if (mode === 'raw') autoScroll();
  }

  const rt = setInterval(() => {
    if (!isRunning) { clearInterval(rt); return; }
    const ch = RAW[rawIdx] || '';
    rawIdx += (ch === ' ' || ch === '\n') ? 2 : 1;
    if (rawIdx >= rawTotal) { rawIdx = rawTotal; rawDone = true; clearInterval(rt); }
    renderRaw(rawIdx);
  }, 30 / sp);

  for (const line of LOG) {
    if (line.t === '') { const d = document.createElement('div'); d.innerHTML = '&nbsp;'; nv.appendChild(d); await sleep(line.d); if (mode === 'normal') autoScroll(); continue; }
    const d = document.createElement('div');
    d.style.color = line.c || '#9A9A9A';
    if (line.b) d.style.fontWeight = '700';
    if (line.i) d.style.fontStyle = 'italic';
    nv.appendChild(d);
    for (let c = 0; c < line.t.length; c++) {
      d.textContent = line.t.slice(0, c + 1);
      const old = nv.querySelector('.cursor'); if (old) old.remove();
      const cur = document.createElement('span'); cur.className = 'cursor'; d.appendChild(cur);
      if (mode === 'normal') autoScroll();
      await sleep(18);
    }
    const oc = d.querySelector('.cursor'); if (oc) oc.remove();
    await sleep(line.d);
    if (mode === 'normal') autoScroll();
  }
  const last = nv.lastElementChild;
  if (last) last.style.textShadow = '0 0 8px rgba(167,139,250,0.3)';
  clearInterval(rt); rawDone = true; renderRaw(rawTotal);
  isRunning = false;
  document.getElementById('runBtn').disabled = false;
  document.getElementById('runBtn').textContent = 'Replay';
}

// Auto-run on load
window.addEventListener('load', () => { setTimeout(runReplay, 500); });
</script>

</body>
</html>
